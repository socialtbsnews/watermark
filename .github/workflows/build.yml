name: Build desktop app
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ADD=""; [ -f logo.png ] && ADD='--add-data logo.png;.'
          python -m PyInstaller --noconfirm --onefile --windowed --name "TBS Watermark" --collect-all tkinterdnd2 $ADD tbs_watermark.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ADD=""; [ -f logo.png ] && ADD='--add-data logo.png:.'
          python -m PyInstaller --noconfirm --windowed --name "TBS Watermark" --collect-all tkinterdnd2 $ADD tbs_watermark.py
          cd dist && zip -r "TBS-Watermark-mac.zip" "TBS Watermark.app"
      - uses: actions/upload-artifact@v4
        with:
          name: TBS-Watermark-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
