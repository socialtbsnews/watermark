name: Build desktop app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "TBS Watermark" --collect-all tkinterdnd2 --add-data "logo.png;." --add-data "fonts;fonts" --add-data "brand.png;." --add-data "icon.png;." --icon icon.ico --version-file version_info.txt tbs_watermark.py
          mv "dist/TBS Watermark.exe" dist/TBS-Watermark-Windows.exe
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name "TBS Watermark" --osx-bundle-identifier com.tbsnews.watermark --collect-all tkinterdnd2 --add-data "logo.png:." --add-data "fonts:fonts" --add-data "brand.png:." --add-data "icon.png:." --icon icon.png tbs_watermark.py
          cd dist && ditto -c -k --keepParent "TBS Watermark.app" TBS-Watermark-Mac.zip
      - name: Publish to the release (each system as soon as it is built)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "TBS Watermark $TAG" \
              --notes "Download TBS-Watermark-Windows.exe for Windows or TBS-Watermark-Mac.zip for Mac." || true
          for i in 1 2 3; do
            gh release upload "$TAG" dist/TBS-Watermark-* --clobber --repo "${{ github.repository }}" && break
            sleep 5
          done
